# Image Worker + ComfyUI - 獨立部署
# 硬體需求: RTX 5090 32GB VRAM
# 放置位置: 擁有 RTX 5090 的電腦

services:
  # ComfyUI 服務 - 自帶的 Stable Diffusion 推理引擎
  comfyui:
    image: saladtechnologies/comfyui:comfy0.3.61-api1.9.2-torch2.8.0-cuda12.8-dreamshaper8
    container_name: anime-comfyui
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=8188
      - HOST=0.0.0.0
    command: >
      bash -c "cd /opt/ComfyUI && python main.py --port 8188 --listen 0.0.0.0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./comfyui/data:/data
      - ./models/sd:/data/models/checkpoints

  worker-image:
    build:
      context: .
    container_name: anime-worker-image
    restart: unless-stopped
    network_mode: host
    depends_on:
      - comfyui
    environment:
      API_BASE_URL: ${API_BASE_URL}
      WORKER_ID: ${WORKER_ID:-image-01}
      WORKER_TYPE: image
      WORKER_HOSTNAME: ${WORKER_HOSTNAME:-image-worker}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-assets}
      S3_SKIP_SSL_VERIFY: ${S3_SKIP_SSL_VERIFY:-true}
      COMFYUI_API_URL: ${COMFYUI_API_URL:-http://localhost:8188}
      SD_MODEL_NAME: ${SD_MODEL_NAME:-dreamshaper_8.safetensors}
      IMAGE_WIDTH: ${IMAGE_WIDTH:-1024}
      IMAGE_HEIGHT: ${IMAGE_HEIGHT:-1024}
      CFG_SCALE: ${CFG_SCALE:-7.5}
      NUM_INFERENCE_STEPS: ${NUM_INFERENCE_STEPS:-30}
      SAMPLER: ${SAMPLER:-euler_ancestral}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./models/sd:/models/sd
